<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Lista de Compras
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        :root {
            --bg-main: #090d1a;
            --bg-secondary: #11182b;
            --card-bg: #151d33;
            --card-light: #1c2744;

            --green: #55ff99;
            --green-dark: #24c56e;

            --blue: #55cfff;
            --purple: #9b72ff;
            --yellow: #ffd95a;
            --red: #ff5f7e;

            --text: #f4f7ff;
            --muted: #9ca9c8;
        }


        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;

            min-height: 100vh;

            color: var(--text);

            background:
                radial-gradient(
                    circle at top left,
                    rgba(85, 207, 255, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(155, 114, 255, 0.09),
                    transparent 30%
                ),
                var(--bg-main);

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* NAVBAR */

        .game-navbar {
            background:
                rgba(9, 13, 26, 0.94);

            border-bottom:
                2px solid rgba(85, 255, 153, 0.35);

            box-shadow:
                0 0 25px rgba(85, 255, 153, 0.08);

            backdrop-filter:
                blur(10px);
        }


        .navbar-brand {
            color: var(--green) !important;

            font-weight: 900;

            letter-spacing: 1px;

            text-transform: uppercase;

            text-shadow:
                0 0 12px rgba(85, 255, 153, 0.45);
        }


        .navbar .nav-link {
            color: var(--muted);

            font-weight: 700;

            border-radius: 10px;

            padding-left: 14px !important;
            padding-right: 14px !important;

            transition: 0.2s;
        }


        .navbar .nav-link:hover {
            color: var(--green);

            background:
                rgba(85, 255, 153, 0.08);
        }


        /* CONTEÚDO */

        main {
            min-height: 82vh;
        }


        .page-title {
            font-weight: 900;

            letter-spacing: 1px;

            color: var(--text);
        }


        .game-subtitle {
            color: var(--muted);
        }


        /* CARDS */

        .game-card {
            background:
                linear-gradient(
                    145deg,
                    var(--card-bg),
                    var(--bg-secondary)
                );

            color: var(--text);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.2s,
                border-color 0.2s,
                box-shadow 0.2s;
        }


        .game-card:hover {
            transform:
                translateY(-5px);

            border-color:
                rgba(85, 255, 153, 0.35);

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.35),
                0 0 18px rgba(85, 255, 153, 0.06);
        }


        .game-card .card-body {
            padding: 24px;
        }


        .produto-card {
            height: 100%;
        }


        .produto-card img {
            height: 220px;

            object-fit: cover;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.08);
        }


        /* CATEGORIA */

        .category-badge {
            display: inline-block;

            background:
                rgba(85, 207, 255, 0.1);

            color: var(--blue);

            border:
                1px solid rgba(85, 207, 255, 0.3);

            border-radius: 50px;

            padding:
                6px 12px;

            font-size: 0.78rem;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        /* FORMULÁRIOS */

        .form-label {
            color: #dfe6ff;

            font-weight: 700;
        }


        .form-control,
        .form-select {
            background-color:
                rgba(6, 10, 22, 0.7);

            color: white;

            border:
                1px solid rgba(255, 255, 255, 0.12);

            border-radius: 12px;

            padding: 12px 14px;
        }


        .form-control:focus,
        .form-select:focus {
            color: white;

            background-color:
                rgba(6, 10, 22, 0.85);

            border-color: var(--green);

            box-shadow:
                0 0 0 0.2rem
                rgba(85, 255, 153, 0.12);
        }


        .form-control::placeholder {
            color: #697695;
        }


        .form-select option {
            background-color:
                var(--bg-secondary);

            color: white;
        }


        /* BOTÕES */

        .btn {
            border-radius: 10px;

            font-weight: 800;

            padding:
                9px 17px;

            transition: 0.2s;
        }


        .btn-game {
            background:
                linear-gradient(
                    135deg,
                    var(--green),
                    var(--green-dark)
                );

            color: #06120b;

            border: none;

            box-shadow:
                0 8px 20px rgba(85, 255, 153, 0.18);
        }


        .btn-game:hover {
            color: #06120b;

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 25px rgba(85, 255, 153, 0.3);
        }


        .btn-outline-game {
            color: var(--blue);

            border:
                1px solid rgba(85, 207, 255, 0.45);

            background:
                rgba(85, 207, 255, 0.05);
        }


        .btn-outline-game:hover {
            color: #06131b;

            background:
                var(--blue);

            border-color:
                var(--blue);
        }


        .btn-warning {
            background:
                var(--yellow);

            border-color:
                var(--yellow);

            color:
                #171300;
        }


        .btn-danger {
            background:
                var(--red);

            border-color:
                var(--red);
        }


        .btn-secondary {
            background:
                #303a56;

            border-color:
                #303a56;
        }


        /* PAINEL */

        .game-panel {
            background:
                rgba(21, 29, 51, 0.72);

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            padding: 22px;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, 0.22);
        }


        .game-counter {
            display: inline-flex;

            align-items: center;

            gap: 8px;

            background:
                rgba(155, 114, 255, 0.1);

            color:
                #c7b6ff;

            border:
                1px solid rgba(155, 114, 255, 0.28);

            padding:
                8px 14px;

            border-radius:
                50px;

            font-weight: 700;
        }


        /* ALERTA */

        .game-alert {
            background:
                rgba(85, 207, 255, 0.06);

            border:
                1px dashed rgba(85, 207, 255, 0.4);

            color:
                #c8edff;

            border-radius:
                16px;

            padding:
                30px;

            text-align:
                center;
        }


        /* VISUALIZAÇÃO */

        .product-image {
            width: 100%;

            max-height: 420px;

            object-fit: cover;
        }


        .info-box {
            background:
                rgba(255, 255, 255, 0.03);

            border:
                1px solid rgba(255, 255, 255, 0.07);

            border-radius:
                12px;

            padding:
                15px;

            margin-bottom:
                12px;
        }


        .info-box strong {
            color: var(--green);
        }


        /* FOOTER */

        footer {
            background:
                #070a12;

            color:
                var(--muted);

            border-top:
                1px solid rgba(255, 255, 255, 0.06);
        }


        footer strong {
            color:
                var(--green);
        }


        /* RESPONSIVO */

        @media (max-width: 768px) {

            .page-header {
                flex-direction:
                    column;

                align-items:
                    flex-start !important;

                gap:
                    16px;
            }


            .produto-card img {
                height:
                    190px;
            }

        }

    </style>

</head>


<body>


    <nav class="navbar navbar-expand-lg navbar-dark game-navbar">

        <div class="container">

            <a
                class="navbar-brand"
                href="{{ url_for('index') }}"
            >
                🎮 SHOP QUEST
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="menu"
            >

                <div class="navbar-nav ms-auto">

                    <a
                        class="nav-link"
                        href="{{ url_for('index') }}"
                    >
                        🛒 Produtos
                    </a>


                    <a
                        class="nav-link"
                        href="{{ url_for('new') }}"
                    >
                        ✚ Novo Produto
                    </a>


                    <a
                        class="nav-link"
                        href="{{ url_for('about') }}"
                    >
                        🕹 Sobre
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <main class="container py-5">

        {% block content %}

        {% endblock %}

    </main>


    <footer class="py-4 mt-5">

        <div class="container text-center">

            <p class="mb-1">

                <strong>SHOP QUEST</strong>

            </p>

            <small>
                Lista de Compras • Projeto Flask
            </small>

        </div>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


</body>

</html>
